name: 'Dependabot Auto Manage'
description: 'Automatically approve and merge Dependabot PRs for production dependencies'
author: 'ad'

inputs:
  github-token:
    description: 'GitHub token for API calls (use PAT for auto-approval)'
    required: false
  dependency-type:
    description: 'Type of dependencies to auto-merge (direct:production, direct:development, all)'
    required: false
    default: 'direct:production'
  merge-method:
    description: 'Merge method to use (merge, squash, rebase)'
    required: false
    default: 'squash'
  auto-merge:
    description: 'Enable auto-merge (requires branch protection rules)'
    required: false
    default: 'false'
  add-label:
    description: 'Label to add to approved PRs'
    required: false
    default: 'dependabot-approved'
  ignore-regex-pr-title:
    description: 'Regex patterns to ignore PRs (comma-separated). If any pattern matches PR title, PR will be skipped.'
    required: false
  pr-number:
    description: 'PR number (for manual dispatch workflows)'
    required: false
  pr-url:
    description: 'PR URL (for manual dispatch workflows)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Check if PR is from Dependabot
      id: check_dependabot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        PR_URL_INPUT: ${{ inputs.pr-url }}
        EVENT_NAME: ${{ github.event_name }}
        PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
        PR_URL_EVENT: ${{ github.event.pull_request.html_url }}
      run: |
        # Handle manual dispatch with provided PR details
        if [ -n "$PR_NUMBER_INPUT" ] && [ -n "$PR_URL_INPUT" ]; then
          echo "is_dependabot=true" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER_INPUT" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL_INPUT" >> $GITHUB_OUTPUT
          echo "✅ Manual dispatch: processing PR #$PR_NUMBER_INPUT"
        elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          # For pull_request events, check the user from event
          if [[ "$PR_USER_LOGIN" = "dependabot[bot]" || "$PR_USER_LOGIN" = "app/dependabot" ]]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER_EVENT" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL_EVENT" >> $GITHUB_OUTPUT
            echo "✅ Automatic: processing Dependabot PR #$PR_NUMBER_EVENT"
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
            echo "❌ PR is not from Dependabot (author: $PR_USER_LOGIN)"
            exit 0
          fi
        else
          echo "❌ This action requires either pull_request event or manual dispatch with pr-number and pr-url inputs"
          exit 1
        fi

    - name: Get dependency metadata
      id: metadata
      if: steps.check_dependabot.outputs.is_dependabot == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      uses: dependabot/fetch-metadata@v2
      
    - name: Set dependency type for manual dispatch
      id: manual_metadata
      if: steps.check_dependabot.outputs.is_dependabot == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      shell: bash
      env:
        TARGET_TYPE_INPUT: ${{ inputs.dependency-type }}
      run: |
        # For manual dispatch, use the target dependency type directly
        echo "dependency-type=$TARGET_TYPE_INPUT" >> $GITHUB_OUTPUT
        echo "📋 Manual dispatch: processing as $TARGET_TYPE_INPUT dependency"

    - name: Check dependency type
      id: check_dependency
      if: steps.check_dependabot.outputs.is_dependabot == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        DEPENDENCY_TYPE_EVENT: ${{ steps.metadata.outputs.dependency-type }}
        DEPENDENCY_TYPE_MANUAL: ${{ steps.manual_metadata.outputs.dependency-type }}
        TARGET_TYPE_INPUT: ${{ inputs.dependency-type }}
      run: |
        # Get dependency type from appropriate source
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          DEPENDENCY_TYPE="$DEPENDENCY_TYPE_EVENT"
        else
          DEPENDENCY_TYPE="$DEPENDENCY_TYPE_MANUAL"
        fi
        
        TARGET_TYPE="$TARGET_TYPE_INPUT"
        
        echo "Dependency type: $DEPENDENCY_TYPE"
        echo "Target type: $TARGET_TYPE"
        
        if [[ "$TARGET_TYPE" = "all" || "$DEPENDENCY_TYPE" = "$TARGET_TYPE" ]]; then
          echo "should_process=true" >> $GITHUB_OUTPUT
          echo "✅ Dependency type matches target: $DEPENDENCY_TYPE"
        else
          echo "should_process=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping: dependency type $DEPENDENCY_TYPE doesn't match target $TARGET_TYPE"
        fi

    - name: Check ignore regex patterns
      id: check_ignore_regex
      if: steps.check_dependency.outputs.should_process == 'true' && inputs.ignore-regex-pr-title != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        PR_TITLE_EVENT: ${{ github.event.pull_request.title }}
        IGNORE_REGEX: ${{ inputs.ignore-regex-pr-title }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ steps.check_dependabot.outputs.pr_number }}
        REPO: ${{ github.repository }}
      run: |
        # Get PR title (use env var for pull_request events to handle special chars)
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          PR_TITLE="$PR_TITLE_EVENT"
        else
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')
        fi
        
        echo "PR Title: $PR_TITLE"
        
        # Check if any regex pattern matches
        if [ -n "$IGNORE_REGEX" ]; then
          IFS=',' read -ra PATTERNS <<< "$IGNORE_REGEX"
          for pattern in "${PATTERNS[@]}"; do
            # Trim whitespace
            pattern=$(echo "$pattern" | xargs)
            if [ -n "$pattern" ]; then
              echo "Checking pattern: '$pattern'"
              if echo "$PR_TITLE" | grep -qE "$pattern"; then
                echo "❌ PR title matches ignore pattern: '$pattern'"
                echo "should_process=false" >> $GITHUB_OUTPUT
                echo "⏭️ Skipping PR due to ignore pattern match"
                exit 0
              fi
            fi
          done
        fi
        
        echo "✅ No ignore patterns matched"
        echo "should_process=true" >> $GITHUB_OUTPUT

    - name: Set final processing flag
      id: final_processing
      if: steps.check_dependency.outputs.should_process == 'true'
      shell: bash
      env:
        IGNORE_REGEX_INPUT: ${{ inputs.ignore-regex-pr-title }}
        SHOULD_PROCESS_DEP: ${{ steps.check_dependency.outputs.should_process }}
        SHOULD_PROCESS_IGNORE: ${{ steps.check_ignore_regex.outputs.should_process }}
      run: |
        # If ignore regex step didn't run, use the original should_process value
        if [ "$IGNORE_REGEX_INPUT" = "" ]; then
          echo "should_process=$SHOULD_PROCESS_DEP" >> $GITHUB_OUTPUT
        else
          echo "should_process=$SHOULD_PROCESS_IGNORE" >> $GITHUB_OUTPUT
        fi

    - name: Create label if it doesn't exist
      if: steps.final_processing.outputs.should_process == 'true' && inputs.add-label != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        LABEL_NAME_INPUT: ${{ inputs.add-label }}
        REPO: ${{ github.repository }}
      run: |
        LABEL_NAME="$LABEL_NAME_INPUT"
        set -euo pipefail
        
        # Check if label exists
        EXISTING_LABEL=$(gh label list --repo "$REPO" --limit 1000 --json name --jq ".[] | select(.name==\"$LABEL_NAME\") | .name" || echo "")
        
        if [ -z "$EXISTING_LABEL" ]; then
          echo "Creating label: $LABEL_NAME"
          gh label create "$LABEL_NAME" --repo "$REPO" --color "0E8A16" --description "Auto-approved Dependabot PRs"
        else
          echo "Label already exists: $LABEL_NAME"
        fi

    - name: Add label to PR
      if: steps.final_processing.outputs.should_process == 'true' && inputs.add-label != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        LABEL_NAME_INPUT: ${{ inputs.add-label }}
        PR_NUMBER: ${{ steps.check_dependabot.outputs.pr_number }}
        PR_URL: ${{ steps.check_dependabot.outputs.pr_url }}
      run: |
        echo "Adding label '$LABEL_NAME_INPUT' to PR #$PR_NUMBER"
        gh pr edit "$PR_URL" --add-label "$LABEL_NAME_INPUT"

    - name: Approve PR
      if: steps.final_processing.outputs.should_process == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        PR_NUMBER: ${{ steps.check_dependabot.outputs.pr_number }}
        REPO: ${{ github.repository }}
      run: |
        echo "Approving PR #$PR_NUMBER"
        
        # Check if we can approve (requires PAT or specific permissions)
        if gh auth status --hostname github.com 2>/dev/null | grep -q "Token:"; then
          if gh pr review --repo "$REPO" --approve "$PR_NUMBER" 2>/dev/null; then
            echo "✅ PR approved successfully"
          else
            echo "⚠️  Could not approve PR. This might be because:"
            echo "   1. GITHUB_TOKEN doesn't have approval permissions"
            echo "   2. You need to use a Personal Access Token (PAT)"
            echo "   3. The repository requires review from code owners"
            echo ""
            echo "💡 To enable auto-approval, use a PAT with 'repo' scope:"
            echo "   github-token: \$\{{ secrets.PAT_TOKEN }}"
            echo ""
            echo "📝 Continuing with merge attempt..."
          fi
        else
          echo "❌ GitHub token is not properly configured"
          exit 1
        fi

    - name: Merge PR
      if: steps.final_processing.outputs.should_process == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        MERGE_METHOD_INPUT: ${{ inputs.merge-method }}
        AUTO_MERGE_INPUT: ${{ inputs.auto-merge }}
        PR_NUMBER: ${{ steps.check_dependabot.outputs.pr_number }}
        PR_URL: ${{ steps.check_dependabot.outputs.pr_url }}
        REPO: ${{ github.repository }}
      run: |
        MERGE_FLAGS="--$MERGE_METHOD_INPUT"
        
        if [ "$AUTO_MERGE_INPUT" = "true" ]; then
          MERGE_FLAGS="$MERGE_FLAGS --auto"
          echo "Enabling auto-merge for PR #$PR_NUMBER"
        else
          echo "Merging PR #$PR_NUMBER"
        fi
        
        # Attempt to merge
        if gh pr merge --repo "$REPO" $MERGE_FLAGS "$PR_NUMBER" 2>/dev/null; then
          echo "✅ PR merged successfully"
        else
          echo "⚠️  Could not merge PR. This might be because:"
          echo "   1. PR requires approval first"
          echo "   2. Branch protection rules are enforced"
          echo "   3. Merge conflicts exist"
          echo "   4. Required status checks are pending/failing"
          echo ""
          echo "💡 Check the PR status and requirements at:"
          echo "   $PR_URL"
        fi

branding:
  icon: 'check-circle'
  color: 'green'
